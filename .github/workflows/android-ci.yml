name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile-security/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile-security/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: pro-sec-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        run: gradle :apps:mobile-security:assembleDebug
      - name: Run Android unit tests
        run: gradle :apps:mobile-security:testDebugUnitTest
      - name: Run Android Lint
        run: gradle :apps:mobile-security:lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pro-sec-debug-apk
          path: apps/mobile-security/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-sec-android-lint
          path: apps/mobile-security/build/reports/lint-results-debug.html
          if-no-files-found: ignore
