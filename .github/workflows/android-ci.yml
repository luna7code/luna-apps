name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :apps:mobile-security:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-mobile-security-debug
          path: apps/mobile-security/build/outputs/apk/debug/*.apk
          if-no-files-found: error
