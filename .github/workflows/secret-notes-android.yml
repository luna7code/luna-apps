name: SECRET NOTES Android

on:
  push:
    branches:
      - feature/secret-notes-foundation
      - feature/secret-notes-**
  pull_request:
    paths:
      - "secret-notes/**"
      - ".github/workflows/secret-notes-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        working-directory: secret-notes
        run: gradle :app:assembleDebug
      - name: Run unit tests
        working-directory: secret-notes
        run: gradle :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: secret-notes-debug-apk
          path: secret-notes/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
