name: FLY SECRET Phase 1.7 Android shell

on:
  push:
    branches:
      - fly-secret/phase-1.7-functional-android-shell-2026-11-15
    paths:
      - "apps/fly-secret/mobile/**"
      - ".github/workflows/fly-secret-phase-1-7.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/fly-secret/mobile/**"
      - ".github/workflows/fly-secret-phase-1-7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-validation:
    name: Validate FLY SECRET Android shell
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/fly-secret/mobile/package.json
      - name: Install React Native dependencies
        working-directory: apps/fly-secret/mobile
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Test chat state transitions
        working-directory: apps/fly-secret/mobile
        run: npm test
      - name: TypeScript validation
        working-directory: apps/fly-secret/mobile
        run: npm run typecheck
      - name: Build Android debug APK
        run: gradle -p apps/fly-secret/mobile/android --no-daemon :app:assembleDebug
      - name: Verify standalone APK payload
        shell: bash
        run: |
          APK="apps/fly-secret/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle$'
      - uses: actions/upload-artifact@v4
        with:
          name: fly-secret-phase-1.7-debug
          path: apps/fly-secret/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
