name: FLY SECRET Android

on:
  push:
    branches:
      - "fly-secret/**"
    paths:
      - "apps/fly-secret/mobile/**"
      - ".github/workflows/fly-secret-android.yml"
  pull_request:
    paths:
      - "apps/fly-secret/mobile/**"
      - ".github/workflows/fly-secret-android.yml"
  workflow_dispatch:

concurrency:
  group: fly-secret-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Build FLY SECRET standalone debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/fly-secret/mobile/package.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install React Native dependencies
        working-directory: apps/fly-secret/mobile
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build standalone debug APK
        run: gradle -p apps/fly-secret/mobile/android --no-daemon :app:assembleDebug

      - name: Verify APK contains the embedded JavaScript bundle
        shell: bash
        run: |
          APK="apps/fly-secret/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle$'
          echo "Standalone JavaScript bundle is present in the APK."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fly-secret-android-debug
          path: apps/fly-secret/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-secret-android-build-reports
          path: |
            apps/fly-secret/mobile/android/build/reports/**
            apps/fly-secret/mobile/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
