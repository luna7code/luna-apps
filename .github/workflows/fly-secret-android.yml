name: FLY SECRET Android

on:
  push:
    branches:
      - "fly-secret/**"
    paths:
      - "apps/fly-secret/mobile/**"
      - ".github/workflows/fly-secret-android.yml"
  pull_request:
    paths:
      - "apps/fly-secret/mobile/**"
      - ".github/workflows/fly-secret-android.yml"
  workflow_dispatch:

concurrency:
  group: fly-secret-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Build and launch FLY SECRET on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/fly-secret/mobile/package.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install React Native dependencies
        working-directory: apps/fly-secret/mobile
        run: npm install --no-audit --no-fund --no-package-lock

      - name: TypeScript validation
        working-directory: apps/fly-secret/mobile
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/fly-secret/mobile
        run: npm test

      - name: Build standalone debug APK
        run: gradle -p apps/fly-secret/mobile/android --no-daemon :app:assembleDebug

      - name: Verify APK package and embedded JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/fly-secret/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index\\.android\\.bundle$'
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt dump badging "$APK" | grep "package: name='com.flysecret'"
          echo "APK package and embedded JavaScript bundle verified."

      - name: Install and launch on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            APK="apps/fly-secret/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.flysecret
            adb shell am start -W -n com.flysecret/.MainActivity
            sleep 20
            if ! adb shell pidof com.flysecret >/dev/null; then
              echo "FLY SECRET process exited after launch. Capturing crash diagnostics."
              adb logcat -d -v threadtime -t 4000 > fly-secret-logcat.txt
              grep -E -i "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|SIGABRT|UnsatisfiedLinkError|dlopen failed" fly-secret-logcat.txt || true
              cat fly-secret-logcat.txt
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep "com.flysecret"
            adb logcat -d -v threadtime -t 2000 > fly-secret-logcat.txt
            echo "FLY SECRET remained alive for 20 seconds after launch."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fly-secret-android-debug
          path: apps/fly-secret/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-secret-android-emulator-diagnostics
          path: fly-secret-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-secret-android-build-reports
          path: |
            apps/fly-secret/mobile/android/build/reports/**
            apps/fly-secret/mobile/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
